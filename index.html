<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formularz komunikacyjny – Sezon Francja–Polska 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#3b1a1a;--red:#ff4426;--green:#1ce14a;--blue:#4586ff;--bg:#f4efe9;--line:#d9cdc2;--err:#c4331c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Fira Sans',system-ui,sans-serif;color:var(--brown);-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.5}
a{color:var(--brown)}a:hover{color:var(--red)}
a.mail{font-weight:700;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
a.mail:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{height:96px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1;color:var(--red)}
.top img{height:64px;width:auto;display:block}
.draft{font-size:14px;color:var(--brown)}
.hero{padding:56px 0 40px}
.hero h1{margin:0;font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.01em;max-width:820px}
.hero p{margin:14px 0 0;font-size:19px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start;padding-bottom:96px}
.steps{position:sticky;top:24px;display:flex;flex-direction:column;gap:4px}
.step{display:flex;gap:12px;align-items:center;background:none;border:0;padding:10px 12px;border-radius:12px;font:inherit;font-size:15px;color:var(--brown);text-align:left;cursor:pointer}
.step:hover{background:#fff}
.step{align-items:flex-start!important;line-height:1.35}
.step .tx{padding-top:4px}
.step .dot{display:block;width:8px;height:8px;border-radius:50%;background:currentColor}
.step .n{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#fff}
.miss-note{font-size:15px;color:#6b4b44;text-align:right;margin:20px 0 -16px}
.miss-note:empty{display:none}
.step .miss{display:block;font-size:13px;font-weight:400;color:#6b4b44;margin-top:1px}
.step.lock{opacity:.5;cursor:not-allowed}
.step.lock:hover{background:none}
.step.cur{background:#fff;font-weight:700}
.step.cur .n{background:var(--red)}
.step.done .n{background:var(--brown);color:#fff}
.step.bad .n{background:var(--err);border-color:var(--err);color:#fff}
.bar{display:none;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--brown)}
.card{background:#fff;border-radius:24px;padding:40px}
.card+.card{margin-top:20px}
h2{margin:0 0 8px;font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:46px;line-height:1}
.kicker{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.req-note{font-size:15px;margin:0 0 28px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:26px}
.field:first-of-type{margin-top:0}
.lbl{font-weight:600;font-size:17px}
.lbl .star{color:var(--err)}
.help{font-size:15px;line-height:1.5;color:#5a3a33}
p,.help,.lbl,.check span{text-wrap:pretty}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:13px 15px;border:1.5px solid #c9bcb1;border-radius:12px;background:#fff;font:inherit;font-size:16px;color:var(--brown);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(69,134,255,.25)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;margin-top:26px;align-items:stretch}
.two>.field{margin-top:0}
.two>.field>.help{flex:1 0 auto}
.req-note+.two,.sub+.two{margin-top:18px}
@media (max-width:860px){.two{gap:26px 0}}
input.short{max-width:220px}
input.xs{max-width:160px}
input.tm{max-width:140px}
@media (max-width:560px){input.short,input.xs{max-width:none}}
.cnt{font-size:14px;align-self:flex-end}
.cnt.over{color:var(--err);font-weight:700}
.field.err input,.field.err select,.field.err textarea{border-color:var(--err)}
.msg{display:none;font-size:14px;font-weight:600;color:var(--err)}
.field.err .msg{display:block}
.grid{width:100%;border-collapse:collapse;font-size:15px}
.grid th{font-weight:600;padding:8px;text-align:center;width:120px}
.grid th:first-child{text-align:left;width:auto}
.grid td{padding:10px 8px;border-top:1px solid #efe7df;text-align:center}
.grid td:first-child{text-align:left}
.grid input{width:20px;height:20px;accent-color:var(--brown)}
.check{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--brown)}
.intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.intro h3{margin:0 0 6px;font-size:18px}
.intro p{margin:0;font-size:16px}
.drive{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--green);border-radius:18px;padding:22px 26px;margin-top:28px}
.drive b{font-size:18px}
.drive .t{font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:15px 30px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--red);color:var(--brown)}
.btn:hover{background:#ff6a52;color:var(--brown)}
.btn:focus-visible,.step:focus-visible,.drop:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.sec{background:transparent;border:2px solid var(--brown)}
.btn.sec:hover{background:#fff}
.btn.dark{background:var(--brown);color:#fff;white-space:nowrap}
.btn.dark:hover{background:#5a2a24;color:#fff}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px}
details.info{border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;margin-top:22px}
details.info summary{cursor:pointer;font-weight:700}
details.info p{margin:12px 0 0;font-size:15px}
.drop{margin-top:26px;border:2px dashed var(--brown);border-radius:20px;padding:36px 24px;text-align:center;cursor:pointer;background:#fbf8f5;transition:background .15s}
.drop.over{background:#eafbea;border-color:#1a8a3c}
.drop b{display:block;font-size:20px;margin-bottom:6px}
.drop span{font-size:15px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.file{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;font-size:13px;position:relative}
.file .th{height:100px;background:repeating-linear-gradient(135deg,#ece3da 0 10px,#f4ede6 10px 20px);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.file .th img{width:100%;height:100%;object-fit:cover;display:block}
.file .nm{padding:8px 10px 2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .sz{padding:0 10px 8px}
.file button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--brown);color:#fff;font-size:16px;cursor:pointer;line-height:1}
.warn{margin-top:12px;font-size:14px;font-weight:600;color:var(--err)}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{position:relative;display:inline-flex;cursor:pointer}
.kchip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.kchip span{padding:9px 16px;border:1.5px solid #c9bcb1;border-radius:999px;background:#fff;font-size:15px;line-height:1.3;white-space:nowrap}
.kchip span:hover{border-color:var(--brown)}
.kchip input:checked+span{background:var(--brown);border-color:var(--brown);color:#fff}
.kchip input:checked+span::before{content:'✓ '}
.kchip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.field.err .kchip span{border-color:var(--err)}
.kother{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-width:420px}
.kother .lbl{font-size:15px}
.addx{align-self:flex-start;margin-top:4px}
@media (max-width:860px){.addx[aria-hidden=true]{display:none}}
details.more{margin-top:26px;border:1.5px solid var(--line);border-radius:16px;padding:18px 22px}
details.more summary{cursor:pointer;font-weight:700;font-size:17px}
details.more summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px;border-radius:6px}
details.more .msub{display:block;font-weight:400;font-size:15px;color:#5a3a33;margin-top:2px}
details.more>.field:first-of-type{margin-top:18px}
[hidden]{display:none!important}
.two:has(>[hidden]){grid-template-columns:minmax(0,1fr)}
.two:has(>[hidden]) select{max-width:calc(50% - 10px)}
@media (max-width:860px){.two:has(>[hidden]) select{max-width:none}}
.rwrap{display:flex;flex-direction:column;gap:8px}
.rtb{display:flex;gap:6px}
.rbtn{width:44px;height:40px;border:1.5px solid #c9bcb1;border-radius:10px;background:#fff;font:inherit;font-size:17px;color:var(--brown);cursor:pointer}
.rbtn:hover{border-color:var(--brown)}
.rbtn[aria-pressed=true]{background:var(--brown);border-color:var(--brown);color:#fff}
.rbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rich{min-height:150px;padding:13px 15px;border:1.5px solid #c9bcb1;border-radius:12px;background:#fff;font-size:16px;line-height:1.5;color:var(--brown);outline:none;white-space:pre-wrap;overflow-wrap:anywhere;resize:vertical;overflow:auto}
.rich:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(69,134,255,.25)}
.field.err .rich{border-color:var(--err)}
.alert ul{margin:8px 0 0;padding-left:20px;font-weight:600}
.alert li{margin-top:4px}
.alert a{color:var(--brown);text-decoration:underline;text-underline-offset:3px}
.alert a:hover{color:#fff}
.alert a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.overlay .box:focus{outline:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.legal{max-height:280px;overflow:auto;border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;font-size:15px;margin-top:20px;background:#fbf8f5}
.legal p{margin:0 0 12px}
.alert{background:var(--red);border-radius:14px;padding:14px 18px;font-weight:700;margin-bottom:20px}
.overlay{position:fixed;inset:0;background:rgba(59,26,26,.55);display:none;align-items:center;justify-content:center;z-index:9}
.overlay.on{display:flex}
.overlay .box{background:#fff;border-radius:24px;padding:36px 40px;width:min(480px,90vw)}
.overlay .pb{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:18px}
.overlay .pb i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin-bottom:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{margin:44px 0 0;padding-top:28px;border-top:1.5px solid var(--line);font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1.05}
.req-note+.sub{margin-top:8px;border-top:0;padding-top:0}
.sub+.field{margin-top:18px}
.legal+.field{margin-top:20px}
h2[tabindex]:focus{outline:none}
.btn{white-space:nowrap;flex-shrink:0}
.nav{flex-wrap:wrap;row-gap:12px}
.nav-r{margin-left:auto}
@media (max-width:640px){.nav>.btn.sec{order:2}.nav-r{width:100%;flex-direction:column-reverse;align-items:stretch}.nav-r .btn{justify-content:center}}
.fsum{margin-top:18px;font-size:15px;font-weight:600}
.flist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.fi{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.fi .th{width:64px;height:48px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(135deg,#ece3da 0 8px,#f4ede6 8px 16px);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.fi .th img{width:100%;height:100%;object-fit:cover;display:block}
.fi .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .sz{font-size:13px}
.pbar{height:6px;background:#efe7df;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--brown);transition:width .2s}
.fi.done .pbar i{background:#1a8a3c}
.fi.err,.fi.big{border-color:var(--err)}
.fi.err .sz,.fi.big .sz{color:var(--err);font-weight:600}
.fi.err .pbar i,.fi.big .pbar i{background:var(--err)}
.x{width:32px;height:32px;border-radius:50%;border:0;background:var(--brown);color:#fff;font-size:18px;cursor:pointer;line-height:1}
.mini{border:2px solid var(--brown);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--brown);cursor:pointer}
.nav-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn.ghost{background:transparent;text-decoration:underline;padding:15px 12px}
.btn.ghost:hover{background:transparent;color:var(--err)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:14px 20px;border-radius:14px;font-size:15px;line-height:1.45;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--err)}
.fmeta{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;padding-top:4px}
.fmeta label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.fmeta input,.fmeta select{padding:9px 12px;font-size:15px}
.fmeta input.bad{border-color:var(--err)}
.fhint{font-size:14px;margin-top:4px}
.rep{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;gap:10px;align-items:center}
.rrow input{flex:1;min-width:0}
.orgs{display:flex;flex-direction:column;gap:12px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mgrid.full{grid-template-columns:minmax(0,1fr)}
.mgrid.addr{grid-template-columns:minmax(0,140px) minmax(0,1fr)}
.orow .mrow-in input{padding:10px 12px;font-size:15px}
.orow label.mcheck{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:10px;font-size:15px;font-weight:600;cursor:pointer}
.mcheck input{width:20px;height:20px;margin:0;accent-color:var(--brown)}
.macts{display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){.mgrid,.mgrid.addr{grid-template-columns:minmax(0,1fr)}}
.orow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:start;border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.onum{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.obody{display:flex;flex-direction:column;gap:12px;min-width:0}
.ogrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.orow label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.orow input[type=text]{padding:10px 12px;font-size:15px}
.orow input.bad{border-color:var(--err)}
.olbl{font-size:14px;font-weight:600;margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-radius:12px}
.chips.bad{outline:2px solid var(--err);outline-offset:4px}
.orow label.chip{display:inline-flex;flex-direction:row;position:relative;cursor:pointer;font-weight:500}
.ogrid label{justify-content:space-between}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;white-space:nowrap;padding:7px 14px;border:1.5px solid #c9bcb1;border-radius:999px;font-size:14px;background:#fff}
.chip input:checked+span{background:var(--brown);border-color:var(--brown);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.oact{display:flex;gap:6px}
.ob{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--brown);background:#fff;color:var(--brown);font-size:15px;cursor:pointer}
.orgs .mini{align-self:flex-start;padding:8px 16px}
@media (max-width:640px){.ogrid{grid-template-columns:minmax(0,1fr)}.orow{grid-template-columns:minmax(0,1fr) auto}.onum{display:none}}
.rep .mini{align-self:flex-start;padding:8px 16px}
.fmeta label:first-child{grid-column:1/-1;max-width:260px}
@media (max-width:640px){.fmeta{grid-template-columns:minmax(0,1fr)}.fmeta label{grid-column:1/-1!important;max-width:none}}
@media (max-width:860px){
  .top-in{height:72px}.top img{height:44px}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .steps{display:none}.bar{display:block}
  .hero h1{font-size:44px}.card{padding:26px 20px;border-radius:18px}
  .two,.intro{grid-template-columns:minmax(0,1fr)}
  .drive{flex-direction:column;align-items:flex-start}
  .grid th{width:auto;font-size:13px}
}
.top-r{display:flex;align-items:center;gap:16px}
.lang{display:flex;gap:2px;border:2px solid var(--brown);border-radius:999px;padding:2px;background:#fff}
.lang button{min-width:44px;height:40px;border:0;border-radius:999px;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--brown);cursor:pointer}
.lang button:hover{background:#f4efe9}
.lang button[aria-pressed="true"]{background:var(--brown);color:#fff}
.lang button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

<body>
<header class="top"><div class="wrap top-in"><div id="logo"></div><div class="top-r"><span class="draft" id="draft" aria-live="polite"></span><div class="lang" role="group" aria-label="Langue · Język · Language"><button type="button" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button><button type="button" data-lang="pl" lang="pl" aria-label="Polski" aria-pressed="false">PL</button><button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button></div></div></div></header>
<div class="hero"><div class="wrap"><h1>Formularz komunikacyjny</h1><p>Sezon Francja–Polska 2027</p></div></div>
<div class="wrap layout">
  <nav class="steps" id="steps" aria-label="Sekcje formularza"></nav>
  <main id="main"><div class="bar" id="bar"><i></i></div><div id="page"></div></main>
</div>
<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovT"><div class="box" tabindex="-1"><b id="ovT" style="font-size:20px">Wysyłanie zgłoszenia…</b><div id="ovS" style="font-size:15px;margin-top:6px"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="sr" role="status" aria-live="polite"></div>

<script>
/* ---------- języki formularza: FR (domyślnie), PL, EN ----------
 * Źródłowe teksty formularza są po polsku. T() tłumaczy je na język wybrany w nagłówku.
 * Nowy tekst w formularzu = nowy wpis w I18 (klucz po polsku: [francuski, angielski]).
 */
let LANG = (() => { const q = new URLSearchParams(location.search).get('lang'); let l = q; try { if (!l) l = localStorage.getItem('sezon2027_lang'); else localStorage.setItem('sezon2027_lang', l); } catch (e) {} return ['fr', 'pl', 'en'].indexOf(l) >= 0 ? l : 'fr'; })();
document.documentElement.lang = LANG;
const I18 = {
 'Formularz komunikacyjny': ['Formulaire de communication', 'Communication form'],
 'Sezon Francja–Polska 2027': ['Saison Pologne–France 2027', 'Saison Pologne–France 2027'],

 'Cel formularza': ['Objet du formulaire', 'Purpose of the form'],
 'Prosimy osoby odpowiedzialne za organizację i komunikację wydarzeń Sezonu Francja–Polska 2027 o przekazanie informacji potrzebnych do zaplanowania promocji i przedstawienia wydarzenia publiczności.': ['Nous demandons aux personnes chargées de l’organisation et de la communication des événements de la Saison Pologne–France 2027 de nous transmettre les informations nécessaires pour planifier leur promotion et présenter l’événement au public.', 'We ask the people responsible for organising and communicating events of the Saison Pologne–France 2027 to provide the information we need to plan promotion and present the event to the public.'],
 'Gdzie wykorzystamy informacje': ['Utilisation des informations', 'How we will use the information'],
 'Na podstawie odpowiedzi przygotujemy oficjalny program i informator Sezonu, treści na stronę internetową i do mediów społecznościowych, materiały prasowe oraz pozostałe materiały promocyjne.': ['À partir de vos réponses, nous préparerons le programme officiel et le guide de la Saison, les contenus du site internet et des réseaux sociaux, les supports de presse ainsi que les autres supports de communication.', 'Based on your answers, we will prepare the official programme and guide of the Season, content for the website and social media, press materials and other promotional materials.'],
 'Jak przesłać zgłoszenie': ['Comment remplir le formulaire', 'How to submit'],
 'Wypełnij formularz po francusku, osobno dla każdego wydarzenia. Dodatkowe terminy i miejsca tego samego wydarzenia wpisz w jednym zgłoszeniu. Zachowaj oficjalną pisownię nazw własnych i adresów. W razie problemów technicznych wypełnij plik Excel z pytaniami, dołączony do wiadomości z linkiem do formularza, i odeślij go na adres': ['Remplissez le formulaire en français, un formulaire par événement. Indiquez les dates et lieux supplémentaires d’un même événement dans un seul formulaire. Respectez l’orthographe officielle des noms propres et des adresses. En cas de problème technique, remplissez le fichier Excel joint au message contenant le lien vers le formulaire et renvoyez-le à l’adresse', 'Please fill in the form in French, one form per event. Enter additional dates and venues of the same event in a single submission. Keep the official spelling of names and addresses. If you have technical problems, fill in the Excel file attached to the message with the link to the form and send it back to'],
 'Jak udostępnić pliki': ['Comment transmettre les fichiers', 'How to share files'],
 'Zdjęcia, logotypy i grafiki dodasz w sekcji „Materiały promocyjne”. Wideo i pliki powyżej 50 MB udostępnij tam linkiem do folderu, np. na Dysku Google, w WeTransfer albo Dropboxie. W nazwach zdjęć i filmów uwzględnij osoby lub obiekty przedstawione w materiale oraz autorstwo.': ['Ajoutez les photos, logos et visuels dans la section « Supports de communication ». Pour les vidéos et les fichiers de plus de 50 Mo, indiquez-y un lien vers un dossier, par exemple sur Google Drive, WeTransfer ou Dropbox. Dans le nom des photos et des vidéos, mentionnez les personnes ou les objets représentés ainsi que l’auteur.', 'Add photos, logos and graphics in the “Promotional materials” section. For videos and files over 50 MB, share a link to a folder there, e.g. on Google Drive, WeTransfer or Dropbox. In the names of photos and videos, include the people or objects shown and the author.'],
 'Twój adres e-mail': ['Votre adresse e-mail', 'Your email address'],
 'Wyślemy na niego potwierdzenie zgłoszenia i, jeśli zechcesz, link do dokończenia formularza.': ['Nous y enverrons la confirmation d’envoi et, si vous le souhaitez, un lien pour terminer le formulaire plus tard.', 'We will send the confirmation there and, if you wish, a link to finish the form later.'],
 'Wpisz poprawny adres e-mail.': ['Saisissez une adresse e-mail valide.', 'Enter a valid email address.'],
 'Wypełnianie zajmuje ok. 20–30 minut. Odpowiedzi zapisują się na bieżąco w tej przeglądarce. Przycisk „Zapisz i dokończ później” wyśle Ci link, którym wrócisz do formularza na dowolnym urządzeniu.': ['Comptez environ 20 à 30 minutes. Vos réponses sont enregistrées au fur et à mesure dans ce navigateur. Le bouton « Enregistrer et terminer plus tard » vous envoie un lien pour reprendre le formulaire sur n’importe quel appareil.', 'It takes about 20–30 minutes. Your answers are saved as you go in this browser. The “Save and finish later” button sends you a link to return to the form on any device.'],

 'Podaj praktyczne informacje o udogodnieniach, np. zasady dostępu, język napisów lub tłumaczenia oraz terminy, w których dana usługa będzie dostępna. Możesz dodać link ze szczegółami.': ['Donnez des informations pratiques, par ex. les modalités d’accès, la langue des sous-titres ou de l’interprétation et les dates où le service est proposé. Vous pouvez ajouter un lien détaillé.', 'Give practical information, e.g. access arrangements, the language of subtitles or interpretation and the dates when the service is available. You can add a link with details.'],
 'Wpisz pełny adres, np. https://…': ['Saisissez l’adresse complète, par ex. https://…', 'Enter the full address, e.g. https://…'],
 'Jakie materiały przekazać': ['Quels supports transmettre', 'What materials to provide'],
 'Przekaż oficjalne materiały dopuszczone do wykorzystania w internecie, druku, na nośnikach reklamy zewnętrznej oraz na ekranach podczas wydarzeń. Prosimy o pliki w najwyższej dostępnej jakości.': ['Transmettez les supports officiels autorisés pour une utilisation en ligne, en impression, en affichage extérieur et sur écrans pendant les événements. Merci de fournir des fichiers de la meilleure qualité disponible.', 'Provide official materials approved for use online, in print, on outdoor advertising and on screens at events. Please send files in the highest available quality.'],
 'Zdjęcia.': ['Photos.', 'Photos.'],
 'Udostępnij 2–3 poziome propozycje zdjęcia głównego i do 20 zdjęć dodatkowych w formatach poziomym i pionowym. Dołącz autoryzowane portrety prasowe w wysokiej rozdzielczości dla wszystkich wymienionych osób. Prześlij pliki JPEG w najwyższej jakości, o rozdzielczości min. 20 Mpx (ok. 5500 × 3600 px), z wolną przestrzenią do składu, bez filtrów, napisów i znaków wodnych.': ['Proposez 2 ou 3 photos principales au format paysage et jusqu’à 20 photos supplémentaires aux formats paysage et portrait. Joignez des portraits presse autorisés en haute définition de toutes les personnes citées. Envoyez des fichiers JPEG de la meilleure qualité, d’au moins 20 Mpx (env. 5 500 × 3 600 px), avec de l’espace libre pour la mise en page, sans filtres, textes ni filigranes.', 'Provide 2–3 landscape options for the main photo and up to 20 additional photos in landscape and portrait formats. Include authorised high-resolution press portraits of everyone named. Send top-quality JPEG files of at least 20 MP (approx. 5500 × 3600 px), with free space for layout, without filters, text or watermarks.'],
 'Wideo.': ['Vidéo.', 'Video.'],
 'Prześlij pliki MP4 lub MOV, 25 kl./s, najlepiej w 4K, co najmniej w Full HD (1920 × 1080 px lub odpowiednik w pionie). Dołącz ujęcia poziome (16:9) i pionowe (9:16) bez napisów i grafik. W miarę możliwości udostępnij wersje ze ścieżką dźwiękową i bez niej. Używaj muzyki objętej licencją.': ['Envoyez des fichiers MP4 ou MOV, 25 i/s, idéalement en 4K, au minimum en Full HD (1920 × 1080 px ou équivalent vertical). Joignez des plans horizontaux (16:9) et verticaux (9:16) sans textes ni graphismes. Si possible, fournissez des versions avec et sans bande son. Utilisez uniquement de la musique sous licence.', 'Send MP4 or MOV files at 25 fps, ideally 4K, at least Full HD (1920 × 1080 px or vertical equivalent). Include horizontal (16:9) and vertical (9:16) shots without text or graphics. If possible, provide versions with and without a soundtrack. Use licensed music only.'],
 'Logotypy i grafiki.': ['Logos et visuels.', 'Logos and graphics.'],
 'Dołącz księgi znaku organizatorów, kolory firmowe (CMYK, Pantone, RGB i HEX), logotypy wektorowe (AI, EPS, SVG lub PDF) i pliki PNG z przezroczystym tłem. Uwzględnij wersje kolorowe, monochromatyczne i w negatywie. Grafiki prześlij w plikach otwartych (AI, PSD lub INDD) albo jako PDF w wysokiej rozdzielczości.': ['Joignez les chartes graphiques des organisateurs, les couleurs (CMJN, Pantone, RVB et HEX), les logos vectoriels (AI, EPS, SVG ou PDF) et des fichiers PNG sur fond transparent, en versions couleur, monochrome et négatif. Envoyez les visuels en fichiers sources (AI, PSD ou INDD) ou en PDF haute définition.', 'Include the organisers’ brand guidelines, brand colours (CMYK, Pantone, RGB and HEX), vector logos (AI, EPS, SVG or PDF) and PNG files with a transparent background, in colour, monochrome and negative versions. Send graphics as open files (AI, PSD or INDD) or as high-resolution PDFs.'],
 'Przeciągnij tutaj zdjęcia, logotypy i grafiki': ['Glissez ici vos photos, logos et visuels', 'Drag photos, logos and graphics here'],
 'Przy każdym pliku sprawdź rodzaj. Przy zdjęciach i filmach podaj autora i krótko opisz, co przedstawia. Opis wykorzystamy także jako tekst alternatywny dla osób niewidomych. Przy logotypach i grafikach autor nie jest potrzebny.': ['Vérifiez le type de chaque fichier. Pour les photos et les vidéos, indiquez l’auteur et décrivez brièvement ce qu’elles montrent. Cette description servira aussi de texte alternatif pour les personnes aveugles. Pour les logos et visuels, l’auteur n’est pas nécessaire.', 'Check the type of each file. For photos and videos, give the author and briefly describe what they show. We will also use the description as alternative text for blind people. No author is needed for logos and graphics.'],

 'np. Program wydarzenia': ['ex. Programme de l’événement', 'e.g. Event programme'],
 'Folder z materiałami promocyjnymi': ['Dossier de supports de communication', 'Folder with promotional materials'],
 'Wklej link do folderu z wideo i plikami powyżej 50 MB (Dysk Google, WeTransfer, Dropbox). Upewnij się, że zespół Sezonu ma do niego dostęp. Pole nie jest wymagane, jeśli wszystkie pliki zostały dodane powyżej. W nazwie folderu podaj tytuł wydarzenia i nazwę organizatora.': ['Collez le lien vers un dossier contenant les vidéos et les fichiers de plus de 50 Mo (Google Drive, WeTransfer, Dropbox). Vérifiez que l’équipe de la Saison y a accès. Ce champ n’est pas obligatoire si tous les fichiers ont été ajoutés ci-dessus. Indiquez dans le nom du dossier le titre de l’événement et le nom de l’organisateur.', 'Paste a link to a folder with videos and files over 50 MB (Google Drive, WeTransfer, Dropbox). Make sure the Season team can access it. This field is not required if all files were added above. Include the event title and the organiser’s name in the folder name.'],
 'Opisy plików z folderu': ['Description des fichiers du dossier', 'Descriptions of files in the folder'],
 'Wymagane, jeśli podajesz link do folderu powyżej. Przy każdym pliku podaj nazwę, autora i co przedstawia, każdy plik w osobnym wierszu. Dla wideo dodaj czas trwania, orientację i języki napisów. Możesz też wkleić link do wykazu plików.': ['Obligatoire si vous indiquez un lien vers un dossier. Pour chaque fichier, indiquez sur une ligne le nom, l’auteur et ce qu’il représente. Pour les vidéos, ajoutez la durée, l’orientation et la langue des sous-titres. Vous pouvez aussi coller un lien vers une liste des fichiers.', 'Required if you provide a folder link above. For each file, give its name, author and what it shows, one file per line. For videos, add the duration, orientation and subtitle languages. You can also paste a link to a list of files.'],
 'Ograniczenia w wykorzystaniu materiałów': ['Restrictions d’utilisation', 'Usage restrictions'],
 'Opisz ograniczenia, jeśli są, np. tylko do materiałów prasowych, do określonej daty, bez kadrowania albo z obowiązkowym podpisem twórcy przedstawionego dzieła.': ['Précisez les restrictions éventuelles, par ex. usage presse uniquement, jusqu’à une date donnée, sans recadrage ou avec mention obligatoire de l’auteur de l’œuvre représentée.', 'Describe any restrictions, e.g. press use only, until a certain date, no cropping, or with a mandatory credit for the creator of the work shown.'],
 'Publiczne linki do wideo': ['Liens publics vers des vidéos', 'Public video links'],
 'Podaj linki YouTube lub Vimeo do filmów, które można osadzić na stronie wydarzenia.': ['Indiquez des liens YouTube ou Vimeo vers des vidéos pouvant être intégrées à la page de l’événement.', 'Provide YouTube or Vimeo links to videos that can be embedded on the event page.'],
 '+ Dodaj kolejny link': ['+ Ajouter un lien', '+ Add another link'],
 'Wpisz pełny adres, np. https://www.youtube.com/…': ['Saisissez l’adresse complète, par ex. https://www.youtube.com/…', 'Enter the full address, e.g. https://www.youtube.com/…'],
 'Strony i media społecznościowe': ['Sites et réseaux sociaux', 'Websites and social media'],
 'Strona wydarzenia': ['Page de l’événement', 'Event page'],
 'Podaj link do strony wydarzenia u organizatora.': ['Indiquez le lien vers la page de l’événement sur le site de l’organisateur.', 'Enter the link to the event page on the organiser’s website.'],
 'Strona organizatora': ['Site de l’organisateur', 'Organiser’s website'],
 'Podaj link do głównej strony organizatora.': ['Indiquez le lien vers le site principal de l’organisateur.', 'Enter the link to the organiser’s main website.'],
 'Media społecznościowe, wspólne publikacje i inne linki': ['Réseaux sociaux, publications communes et autres liens', 'Social media, joint posts and other links'],
 'Podaj stronę organizatora na Facebooku, jego konto na Instagramie, link do wydarzenia na Facebooku oraz pozostałe kanały i istotne linki. Uwzględnij konta na Instagramie współorganizatorów, artystów i kuratorów do oznaczenia. Podaj adres URL i nazwę użytkownika, jeśli dotyczy. Przy każdym koncie na Instagramie lub Facebooku wskaż, czy może współpublikować posty z profilem Sezonu. Dodaj hasztagi i pozostałe oznaczenia do użycia.': ['Indiquez la page Facebook et le compte Instagram de l’organisateur, le lien vers l’événement Facebook ainsi que les autres canaux et liens utiles. Ajoutez les comptes Instagram des coorganisateurs, artistes et commissaires à identifier, avec l’URL et le nom d’utilisateur le cas échéant. Pour chaque compte Instagram ou Facebook, précisez s’il peut publier en collaboration avec le compte de la Saison. Ajoutez les hashtags et identifications à utiliser.', 'Give the organiser’s Facebook page and Instagram account, the Facebook event link and other relevant channels and links. Include the Instagram accounts of co-organisers, artists and curators to tag, with the URL and username where applicable. For each Instagram or Facebook account, state whether it can co-publish posts with the Season’s profile. Add the hashtags and tags to use.'],
 'Kontakty i plan komunikacji': ['Contacts et plan de communication', 'Contacts and communication plan'],
 'Kontakt do osoby zarządzającej projektem': ['Contact de la personne chargée du projet', 'Project manager contact'],
 'Podaj nazwę organizacji, imię i nazwisko, funkcję, telefon i adres e-mail osoby zarządzającej projektem.': ['Indiquez la structure, le prénom et le nom, la fonction, le téléphone et l’adresse e-mail de la personne chargée du projet.', 'Give the organisation, first and last name, position, phone and email of the project manager.'],
 'Za komunikację odpowiada ta sama osoba': ['La même personne est chargée de la communication', 'The same person is responsible for communication'],
 'Kontakt do osoby odpowiedzialnej za komunikację': ['Contact de la personne chargée de la communication', 'Communication contact'],
 'Podaj nazwę organizacji, imię i nazwisko, funkcję, telefon i adres e-mail.': ['Indiquez la structure, le prénom et le nom, la fonction, le téléphone et l’adresse e-mail.', 'Give the organisation, first and last name, position, phone and email.'],
 'Plan komunikacji wydarzenia': ['Plan de communication de l’événement', 'Event communication plan'],
 'Udostępnij link do planu komunikacji wydarzenia lub wyślij plan na adres polognefrance@iam.pl. Pomoże nam to skoordynować promocję wydarzenia z kampanią Sezonu.': ['Partagez le lien vers le plan de communication de l’événement ou envoyez-le à l’adresse polognefrance@iam.pl. Cela nous aidera à coordonner la promotion de l’événement avec la campagne de la Saison.', 'Share a link to the event communication plan or send it to polognefrance@iam.pl. This helps us coordinate the event’s promotion with the Season campaign.'],
 'Dodatkowe uwagi': ['Remarques', 'Additional comments'],
 'Dodaj inne informacje istotne dla zespołu Sezonu.': ['Ajoutez toute autre information utile à l’équipe de la Saison.', 'Add any other information relevant to the Season team.'],
 'Oświadczenie organizatora': ['Déclaration de l’organisateur', 'Organiser’s declaration'],
 'Nota prawna': ['Mentions légales', 'Legal notice'],
 'Przekazując materiały za pośrednictwem formularza i zawartych w nim odnośników, oświadczam, że posiadam pełnię praw autorskich lub licencję do przekazanych materiałów, w tym zdjęć, wideo, logotypów i grafik. Posiadam zgody osób widocznych w materiałach na rozpowszechnianie ich wizerunku. Podane opisy i informacje o autorstwie są prawdziwe i kompletne.': ['En transmettant des supports au moyen du formulaire et des liens qu’il contient, je déclare détenir l’intégralité des droits d’auteur ou une licence sur ces supports, notamment les photos, vidéos, logos et visuels. Je dispose de l’autorisation des personnes visibles sur ces supports pour la diffusion de leur image. Les descriptions et les informations sur les auteurs sont exactes et complètes.', 'By providing materials through this form and the links it contains, I declare that I hold full copyright or a licence to the materials provided, including photos, videos, logos and graphics. I have the consent of the people shown in the materials to the distribution of their image. The descriptions and authorship information given are true and complete.'],
 'Udzielam Instytutowi Adama Mickiewicza oraz podmiotom działającym na jego zlecenie nieodpłatnej, nieograniczonej terytorialnie licencji na korzystanie z materiałów w ramach projektu Sezon Francja–Polska 2027. Licencja obejmuje internet, media społecznościowe, reklamę zewnętrzną i cyfrową, druk, prasę oraz wydarzenia. Obejmuje także prawo do kadrowania, adaptacji formatów i łączenia materiałów z tekstem i grafiką.': ['J’accorde à l’Institut Adam Mickiewicz et aux entités agissant pour son compte une licence gratuite, sans limitation territoriale, d’utilisation des supports dans le cadre du projet Saison Pologne–France 2027. Cette licence couvre internet, les réseaux sociaux, l’affichage extérieur et numérique, l’impression, la presse et les événements. Elle comprend aussi le droit de recadrer, d’adapter les formats et d’associer les supports à des textes et des éléments graphiques.', 'I grant the Adam Mickiewicz Institute and entities acting on its behalf a free, territorially unlimited licence to use the materials as part of the Saison Pologne–France 2027 project. The licence covers the internet, social media, outdoor and digital advertising, print, press and events. It also includes the right to crop, adapt formats and combine the materials with text and graphics.'],
 'Biorę pełną odpowiedzialność za ewentualne roszczenia osób trzecich związane z wykorzystaniem materiałów i zobowiązuję się zwolnić Instytut Adama Mickiewicza z wszelkiej odpowiedzialności z tego tytułu.': ['J’assume l’entière responsabilité de toute réclamation de tiers liée à l’utilisation des supports et m’engage à dégager l’Institut Adam Mickiewicz de toute responsabilité à ce titre.', 'I accept full responsibility for any third-party claims related to the use of the materials and undertake to indemnify the Adam Mickiewicz Institute against any liability in this respect.'],
 'Informacja o redakcji treści': ['Information sur la révision des contenus', 'Note on editing of content'],
 'Instytut Adama Mickiewicza zastrzega sobie prawo do nieograniczonej modyfikacji treści przekazanych w formularzu. Będą one redagowane i formatowane z uwzględnieniem poszczególnych etapów i kanałów komunikacji oraz ogólnej koncepcji komunikacji Sezonu.': ['L’Institut Adam Mickiewicz se réserve le droit de modifier sans restriction les contenus transmis dans le formulaire. Ils seront révisés et mis en forme en fonction des étapes et des canaux de communication ainsi que du concept général de communication de la Saison.', 'The Adam Mickiewicz Institute reserves the right to modify the content submitted in the form without restriction. It will be edited and formatted according to the stages and channels of communication and the overall communication concept of the Season.'],
 'Potwierdzam treść oświadczenia i udzielam opisanej w nim licencji.': ['Je confirme cette déclaration et j’accorde la licence qui y est décrite.', 'I confirm this declaration and grant the licence described in it.'],
 'Potwierdź oświadczenie, aby wysłać zgłoszenie.': ['Confirmez la déclaration pour envoyer le formulaire.', 'Confirm the declaration to send your submission.'],

 'Masz kolejne wydarzenie? Kliknij przycisk poniżej. Organizatorzy, strony, media społecznościowe i kontakty uzupełnią się na podstawie tego zgłoszenia. Poprawki prześlij na adres': ['Vous avez un autre événement ? Cliquez sur le bouton ci-dessous. Les organisateurs, sites, réseaux sociaux et contacts seront repris de ce formulaire. Pour toute correction, écrivez à', 'Have another event? Click the button below. Organisers, websites, social media and contacts will be filled in from this submission. Send corrections to'],

const I18P = [
 [/^(.+) \*$/, (m) => T(m[1]) + ' *'],
 [/^(B|b)rakuje (\d+) (pola|pól)$/, (m, f) => { const n = +m[2]; return f ? (n === 1 ? '1 field missing' : n + ' fields missing') : (n === 1 ? '1 champ manquant' : n + ' champs manquants'); }],
 [/^Sekcja (\d+) z (\d+)$/, (m, f) => (f ? 'Section ' + m[1] + ' of ' : 'Section ' + m[1] + ' sur ') + m[2]],
 [/^Przesłano (\d+) z (\d+)$/, (m, f) => f ? 'Uploaded ' + m[1] + ' of ' + m[2] : 'Envoyés : ' + m[1] + ' sur ' + m[2]],
 [/^(\d+) \/ (\d+) znaków$/, (m, f) => m[1] + ' / ' + m[2] + (f ? ' characters' : ' caractères')],
 [/^(Tryb pokazowy · )?Zapisano (\d{1,2}:\d{2})$/, (m, f) => (m[1] ? (f ? 'Demo mode · ' : 'Mode démo · ') : '') + (f ? 'Saved at ' : 'Enregistré à ') + m[2]],
 [/^(.+): (Tak|Nie|Do potwierdzenia)$/, (m, f) => T(m[1]) + (f ? ': ' : ' : ') + T(m[2])],
 [/^Wpisz, czego dotyczy opcja „(.+)”\.$/, (m, f) => f ? 'Specify the “' + T(m[1]) + '” option.' : 'Précisez l’option « ' + T(m[1]) + ' ».'],
 [/^albo kliknij, aby wybrać pliki · maks\. (\d+) MB każdy · większe pliki, np\. wideo, udostępnij linkiem poniżej$/, (m, f) => f ? 'or click to choose files · max. ' + m[1] + ' MB each · share larger files, such as videos, via a link below' : 'ou cliquez pour choisir des fichiers · ' + m[1] + ' Mo max. par fichier · partagez les fichiers plus lourds, comme les vidéos, via un lien ci-dessous'],
 [/^Ponad (\d+) MB – usuń i udostępnij linkiem poniżej$/, (m, f) => f ? 'Over ' + m[1] + ' MB – remove it and share it via a link below' : 'Plus de ' + m[1] + ' Mo – supprimez-le et partagez-le via un lien ci-dessous'],
 [/^Błąd: ([\s\S]*)$/, (m, f) => (f ? 'Error: ' : 'Erreur : ') + T(m[1])],
 [/^(.+), wpis (\d+)$/, (m, f) => T(m[1]) + (f ? ', line ' : ', ligne ') + m[2]],
 [/^(.+), link (\d+)$/, (m, f) => T(m[1]) + (f ? ', link ' : ', lien ') + m[2]],
 [/^Usuń wpis (\d+)$/, (m, f) => (f ? 'Remove line ' : 'Supprimer la ligne ') + m[1]],
 [/^Usuń link (\d+)$/, (m, f) => (f ? 'Remove link ' : 'Supprimer le lien ') + m[1]],
 [/^Usuń termin (\d+)$/, (m, f) => (f ? 'Remove date ' : 'Supprimer la date ') + m[1]],
 [/^Usuń (.+)$/, (m, f) => (f ? 'Remove ' : 'Supprimer ') + m[1]],

    if (e.key === 'Backspace' && !q.value && a.length > 1 && k > 0) { e.preventDefault(); a.splice(k, 1); vals[id] = a; persist(); rerep(id, k - 1); const n = document.activeElement; if (n && n.setSelectionRange) n.setSelectionRange(n.value.length, n.value.length); say('Usunięto wiersz. Pozostało ' + a.length + '.'); return; }
    return;
  }
  const el = e.target.closest && e.target.closest('.rich'); if (!el) return;
  if ((e.ctrlKey || e.metaKey) && /^[iu]$/i.test(e.key) && e.key.toLowerCase() === 'u') e.preventDefault();
});
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('rich')) { const t = e.target, r = richParse(t); vals[t.dataset.f] = r.text; vals[t.dataset.f + '_r'] = r.segs; const fl = t.closest('.field'); if (fl) fl.classList.remove('err'); persist(); return; }
  if (e.target.dataset.fm) { const t = e.target; vals.fm = vals.fm || {}; vals.fm[t.dataset.fm] = Object.assign({}, vals.fm[t.dataset.fm], { [t.dataset.k]: t.value }); if (t.value.trim()) t.classList.remove('bad'); persist(); if (t.dataset.k === 'k') drawFiles(); return; }
  if (e.target.dataset.x) { vals[e.target.dataset.x] = e.target.checked; persist(); return; }
  const t = e.target, id = t.dataset.f; if (!id) return;
  if (t.dataset.qnone) { vals[id] = t.checked; say(t.checked ? 'Ukryto listę osób.' : 'Pokazano listę osób.'); const fl = t.closest('.field'); if (fl) fl.classList.remove('err'); persist(); setTimeout(() => keep('[data-f="' + id + '"]'), 0); return; }
  if (id === 'email') renderSteps();
  if (t.dataset.kc != null || t.dataset.ko) {
    const sp = Object.keys(IDX).find(l => IDX[l] === id), a = id.slice(1).split('_'), p = SEK[+a[0]].p[+a[1]], o = kv(vals[id]);
    if (t.dataset.ko) o.o = t.value;
    else { const cur = o.sel.map(x => x === '__inne' ? p[4].other : x); o.sel = p[4].opts.filter(x => x === t.dataset.kc ? t.checked : cur.indexOf(x) >= 0); }
    vals[id] = o; const ow = $(id + '_ow'); if (ow) ow.hidden = o.sel.indexOf(p[4].other) < 0;
    const fl = t.closest('.field'); if (fl) fl.classList.remove('err'); persist(); return;
  }
  if (t.dataset.mi != null) {
    const rows = mRows(vals[id]), r = rows[+t.dataset.mi];
    if (t.dataset.mk === 'same') { r.same = t.checked; vals[id] = rows; persist(); say(t.checked ? 'Ukryto pola adresu.' : 'Pokazano pola adresu miejsca.'); setTimeout(() => keep('[data-f="' + id + '"][data-mi="' + t.dataset.mi + '"][data-mk="same"]'), 0); return; }
    r[t.dataset.mk] = t.value; if (String(t.value).trim()) t.classList.remove('bad'); vals[id] = rows;
  }
  else if (t.dataset.oi != null) {
    const rows = orgRows(vals[id]), r = rows[+t.dataset.oi];
    if (t.dataset.ok === 'r') { r.r = t.checked ? r.r.concat([t.value]) : r.r.filter(x => x !== t.value); const ch = t.closest('.chips'); if (ch && r.r.length) ch.classList.remove('bad'); if (t.value === 'Inna rola') setTimeout(() => keep('[data-f="' + id + '"][data-oi="' + t.dataset.oi + '"][data-ok="' + (t.checked ? 'o' : 'r') + '"]'), 0); }
    else { r[t.dataset.ok] = t.value; if (t.value.trim()) t.classList.remove('bad'); }
    vals[id] = rows;
  }
  else if (t.dataset.ri != null) { const a = arrOf(vals[id]).slice(); if (!a.length) a.push(''); a[+t.dataset.ri] = t.value; vals[id] = a; }
  else if (t.type === 'radio') { vals[id] = vals[id] || {}; vals[id][t.dataset.r] = +t.value; }
  else if (t.type === 'checkbox') vals[id] = t.checked;
  else vals[id] = t.value;
  const c = document.querySelector('[data-cnt="' + id + '"]');
  if (c) { const n = t.value.length, max = +c.dataset.max; c.textContent = n + ' / ' + max + ' znaków'; c.classList.toggle('over', n > max); }
  const fld = t.closest('.field'); if (fld) fld.classList.remove('err');
  persist();
});

/* ---------- pliki ---------- */
function addFiles(list) {
  let skipped = 0;
  Array.from(list).forEach(f => {
    if (files.length >= KONFIG.maxPlikow || !f.size) { skipped++; return; }
    files.push({ key: rk(), file: f, name: f.name, size: f.size, type: f.type || 'application/octet-stream', status: f.size > KONFIG.maxMB * 1048576 ? 'big' : 'queue', pct: 0, url: /^image\/(jpeg|png|gif|webp)/.test(f.type) ? URL.createObjectURL(f) : '' });
  });
  if (skipped) toast('Pominięto pliki: ' + skipped + ' (puste lub ponad limit ' + KONFIG.maxPlikow + ' plików).', 1);
  drawFiles(); pump();
}
function pump() {
  while (uploading < 2) {
    const it = files.find(f => f.status === 'queue'); if (!it) break;
    uploading++; it.status = 'up'; it.pct = 0; drawFiles();
    upload(it).then(() => { it.status = 'done'; it.pct = 100; say('Przesłano plik ' + it.name + '.'); }).catch(err => { it.status = 'err'; it.msg = err.message; say('Błąd przesyłania pliku ' + it.name + ': ' + err.message + '.'); })
      .finally(() => { uploading--; drawFiles(); persist(); pump(); });
  }
}
async function upload(it) {
  if (!it.file) throw new Error('Dodaj plik ponownie');
  await ensureToken();
  if (DEMO) { for (let p = 0; p <= 100; p += 5) { it.pct = p; setPct(it); await new Promise(r => setTimeout(r, Math.min(300, 40 + it.size / 4e6))); } it.id = 'demo'; return; }
  let url = null;
  try { url = (await api('upload', { token: token, name: it.name, type: it.type, size: it.size })).url; }
  catch (e) { if (it.size > SMALL) throw e; }
  if (url) {
    try { it.id = await putChunks(url, it); return; }
    catch (e) { if (it.size > SMALL || e.status) throw e; }
  }
  it.pct = 50; setPct(it);
  it.id = (await api('uploadSmall', { token: token, name: it.name, type: it.type, data: await b64(it.file) })).id;
}
function putChunks(url, it) {
  const CH = 16 * 1048576, size = it.size;
  return new Promise((ok, ko) => {
    let start = 0, tries = 0;
    const next = () => {
      const end = Math.min(start + CH, size), x = new XMLHttpRequest();
      x.open('PUT', url);
      x.setRequestHeader('Content-Range', 'bytes ' + start + '-' + (end - 1) + '/' + size);
      x.upload.onprogress = e => { it.pct = Math.min(99, Math.round((start + e.loaded) / size * 100)); setPct(it); };
      x.onload = () => {
        if (x.status === 308) { start = end; tries = 0; next(); }
        else if (x.status === 200 || x.status === 201) { try { ok(JSON.parse(x.responseText).id); } catch (e) { ok(''); } }
        else if (x.status >= 500 && tries++ < 3) setTimeout(next, 1500 * tries);
        else { const er = new Error('serwer odrzucił plik (' + x.status + ')'); er.status = x.status; ko(er); }
      };
      x.onerror = () => {
        if (start > 0 && tries++ < 5) setTimeout(next, 2000 * tries);
        else { const er = new Error('brak połączenia'); er.status = 0; ko(er); }
      };
      x.send(it.file.slice(start, end));
    };
    next();
  });
}
const b64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(f); });
function bindDrop() {
  const d = $('drop'); if (!d) return; const fi = $('fi');
  d.addEventListener('click', () => fi.click());
  d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } });
  fi.addEventListener('change', () => { addFiles(fi.files); fi.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}

/* ---------- zapis, wysyłka ---------- */
async function saveLater() {
  if (emailBad()) { tried.email = true; go(0); return; }
  try {
    await ensureToken();
    await api('save', { token: token, email: vals.email, vals: vals, link: true });
    persist();
    toast('Wysłaliśmy link do dokończenia formularza na adres ' + vals.email + '. Przesłane pliki są zapisane.');
  } catch (err) { toast('Nie udało się zapisać: ' + err.message, 1); }
}
async function send() {
  tried.email = true; SEK.forEach((_, s) => { tried[s] = true; });
  if (emailBad()) { go(0); return; }
  const bad = SEK.findIndex((_, s) => missingOn(s).length);
  if (bad >= 0) { go(bad + 1); return; }
  if (files.some(f => f.status === 'queue' || f.status === 'up')) { go(UP + 1); toast('Poczekaj, aż wszystkie pliki się prześlą.', 1); return; }
  if (files.some(f => f.status === 'err' || f.status === 'big')) { go(UP + 1); toast('Usuń pliki oznaczone na czerwono albo ponów ich przesyłanie.', 1); return; }
  const ov = $('ov'); $('ovS').textContent = 'To potrwa kilka sekund.'; ov.classList.add('on'); ov.querySelector('.box').focus();
  try {
    await ensureToken();
    const pola = [];
    SEK.forEach((S, s) => S.p.forEach((p, i) => p[0] !== 'S' && pola.push(Object.assign({ t: p[1], v: value(s, i), tl: !!p[5] }, p[0] === 'B' && vals[fid(s, i) + '_r'] ? { r: vals[fid(s, i) + '_r'] } : {}))));
    const plikiMeta = files.filter(f => f.status === 'done').map(f => { const m = fmOf(f); const kd = kindOf(f); return { name: f.name, r: KINDS[kd], a: kd === 'z' || kd === 'v' ? m.a || '' : '', d: m.d || '' }; });
    const res = await api('submit', { token: token, email: vals.email, pola: pola, plikiMeta: plikiMeta });
    const tytul = value(0, 0);
    try { localStorage.removeItem(KEY); } catch (e) {}
    ov.classList.remove('on');
    done(res.nr, tytul);
  } catch (err) {
    ov.classList.remove('on');
    toast('Nie udało się wysłać zgłoszenia: ' + err.message + ' Odpowiedzi są zapisane, spróbuj ponownie za chwilę.', 1);
  }
}
function done(nr, tytul) {
  $('steps').innerHTML = ''; $('bar').style.display = 'none';
  document.title = T('Zgłoszenie wysłane') + ' – ' + T(BASE_TITLE); $('page').innerHTML = '<div class="card"><div class="done-ic">✓</div><h2 tabindex="-1">Dziękujemy!</h2><p style="font-size:19px;margin:16px 0 0">Zgłoszenie <b>„' + esc(tytul) + '”</b> zostało wysłane (nr ' + esc(nr) + '). Potwierdzenie wysłaliśmy na adres <b>' + esc(vals.email) + '</b>.</p><p style="margin:12px 0 0">Masz kolejne wydarzenie? Kliknij przycisk poniżej. Organizatorzy, strony, media społecznościowe i kontakty uzupełnią się na podstawie tego zgłoszenia. Poprawki prześlij na adres ' + mailLink() + ', podając numer zgłoszenia.</p><div style="margin-top:28px"><button class="btn sec" id="again">Zgłoś kolejne wydarzenie</button></div></div>';
  $('page').querySelector('h2').focus();
  $('again').onclick = () => { const nv = { email: vals.email, x_same: vals.x_same }; ['Organizatorzy, współorganizatorzy i partnerzy', 'Strona organizatora', 'Media społecznościowe, wspólne publikacje i inne linki', 'Kontakt do osoby zarządzającej projektem', COMM].forEach(l => { if (vals[IDX[l]] != null) nv[IDX[l]] = vals[IDX[l]]; }); vals = nv; files = []; token = null; tried = {}; visited = { 0: true }; persist(); $('bar').style.display = ''; go(1); };
  window.scrollTo({ top: 0 });
}

function gate(msg) {
  $('steps').innerHTML = ''; $('bar').style.display = 'none';
  $('page').innerHTML = '<div class="card" style="max-width:600px"><h2 tabindex="-1">Dostęp do formularza</h2><p style="margin:8px 0 24px">Formularz jest przeznaczony dla organizatorów wydarzeń Sezonu. Wpisz hasło z wiadomości od zespołu Sezonu.</p><form id="gate" novalidate><div class="field' + (msg ? ' err' : '') + '"><label class="lbl" for="pw">Hasło</label><input type="password" id="pw" autocomplete="current-password" aria-describedby="pwm"><span class="msg" id="pwm" role="alert">' + esc(msg || '') + '</span></div><div class="nav"><span></span><button class="btn" type="submit" id="pwb">Wejdź →</button></div></form><p style="margin:20px 0 0;font-size:15px">Nie masz hasła? Napisz na adres ' + mailLink() + '.</p></div>';
  const pw = $('pw'); pw.focus();
  $('gate').onsubmit = async e => {
    e.preventDefault();
    const v = pw.value.trim(); if (!v) { gate('Wpisz hasło.'); return; }

    pass = v;
    try { await api('check', {}); try { localStorage.setItem('sezon2027_formularz_haslo', v); } catch (er) {} $('bar').style.display = ''; init(); }

}
function sieroty(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode && n.parentNode.closest('textarea,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const re = /(^|[\s(„])([aiouwzAIOUWZ])[ \t\n]+/g; let n;
  while ((n = w.nextNode())) { const t = n.nodeValue.replace(re, '$1$2\u00A0').replace(re, '$1$2\u00A0'); if (t !== n.nodeValue) n.nodeValue = t; }
}
SEK.forEach((S, s) => S.p.forEach((p, i) => { const k = fid(s, i); if (p[0] === 'P' && Array.isArray(vals[k])) vals[k] = orgRows(vals[k]).filter(r => r.n.trim()).map(r => r.n.trim() + (r.c.trim() ? ' (' + r.c.trim() + ')' : '') + (r.r.length ? ' – ' + r.r.join(', ') : '')).join('\n'); }));
i18n(document.body); sieroty(document.body);

async function init() {
  if (!DEMO && !pass) { try { await api('check', {}); } catch (e) { gate(); return; } }
  const sz = new URLSearchParams(location.search).get('szkic');
  if (sz) {
    try {
      const r = await api('load', { token: sz });
      if (r) { token = sz; vals = Object.assign({}, r.vals); files = (r.files || []).map(f => Object.assign({}, f, { key: rk(), status: 'done', pct: 100 })); persist(); toast('Wczytaliśmy zapisany formularz nr ' + r.nr + '.'); }
    } catch (err) { toast(err.message, 1); }

  }

}
init().then(() => { let rc = 0; try { rc = +(sessionStorage.getItem('sezon2027_cur') || 0); sessionStorage.removeItem('sezon2027_cur'); } catch (e) {} if (rc > 0 && cur === 0 && !emailBad() && $('steps').innerHTML) go(rc); });
